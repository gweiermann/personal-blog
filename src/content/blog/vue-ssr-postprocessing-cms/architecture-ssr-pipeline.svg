<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" font-family="system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="currentColor"/>
    </marker>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Request -->
  <rect x="10" y="70" width="70" height="40" rx="6" fill="#eaeef2" stroke="#c9d1d9"/>
  <text x="45" y="95" text-anchor="middle">Request</text>
  <path d="M80 90 L105 90" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <!-- Reverse proxy -->
  <rect x="105" y="50" width="90" height="80" rx="6" fill="#ddf4ff" stroke="#0969da" filter="url(#shadow2)"/>
  <text x="150" y="75" text-anchor="middle" font-weight="600">Reverse proxy</text>
  <path d="M150 90 L150 125" stroke="#0969da" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <path d="M105 90 L150 90" stroke="#8c959f" stroke-width="1"/>
  <text x="127" y="85" font-size="10" fill="#57606a">Fetch CMS HTML</text>
  <path d="M150 125 L195 125" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <!-- Extract + Vue SSR -->
  <rect x="195" y="50" width="100" height="80" rx="6" fill="#ddf4ff" stroke="#0969da" filter="url(#shadow2)"/>
  <text x="245" y="72" text-anchor="middle" font-weight="600">SSR step</text>
  <text x="245" y="88" text-anchor="middle" font-size="10">Extract #app</text>
  <text x="245" y="102" text-anchor="middle" font-size="10">Vue renderToString</text>
  <text x="245" y="116" text-anchor="middle" font-size="10">Replace + inject template</text>
  <text x="245" y="132" text-anchor="middle" font-size="9" fill="#57606a">(optional cache)</text>
  <path d="M295 90 L320 90" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <!-- Response -->
  <rect x="320" y="50" width="90" height="80" rx="6" fill="#dafbe1" stroke="#1a7f37" filter="url(#shadow2)"/>
  <text x="365" y="80" text-anchor="middle" font-weight="600">Response</text>
  <text x="365" y="98" text-anchor="middle" font-size="10">SSR HTML</text>
  <text x="365" y="114" text-anchor="middle" font-size="10">+ template string</text>
  <path d="M410 90 L435 90" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <!-- Client -->
  <rect x="435" y="70" width="70" height="40" rx="6" fill="#eaeef2" stroke="#c9d1d9"/>
  <text x="470" y="95" text-anchor="middle">Client</text>
  <!-- Bottom label -->
  <text x="320" y="175" text-anchor="middle" font-size="11" fill="#57606a">HTML is server-side rendered by the proxy before the client receives it.</text>
</svg>
