name: Build and Deploy Static Site (Production Environment)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          NODE_ENV: production
        run: npm run build

      - name: Create deployment directory and verify write access
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: github
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            mkdir -p /var/www/html/gweiermann.de
            echo "Current user: $(whoami)"
            echo "Directory listing:"
            ls -la /var/www/html/
            ls -la /var/www/html/gweiermann.de/ 2>/dev/null || true
            if ! touch /var/www/html/gweiermann.de/.write-test 2>/dev/null; then
              echo "ERROR: github user cannot write to /var/www/html/gweiermann.de"
              echo "On the server (as root) run: sudo chown -R github:www-data /var/www/html/gweiermann.de"
              exit 1
            fi
            rm -f /var/www/html/gweiermann.de/.write-test

      - name: Deploy to server via rsync (same as local SCP)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -p $SSH_PORT" \
            dist/ \
            github@$SSH_HOST:/var/www/html/gweiermann.de/

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: github
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            if [ ! -f "/var/www/html/gweiermann.de/index.html" ]; then
              echo "Error: index.html not found after deployment"
              exit 1
            fi
            echo "Deployment verified successfully"